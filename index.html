<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قیمت بلیط | استخر شهدای بسیج</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#f4f8fb,#e8f3ef);color:#18323a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:min(480px,100%);background:#fff;border-radius:28px;padding:30px 22px;box-shadow:0 18px 55px #153b481c;text-align:center}
.logo{width:82px;height:82px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eef8f3;border:3px solid #168653;font-size:39px}
h1{font-size:25px;margin:18px 0 7px}.sub{color:#718087;font-size:14px;margin-bottom:25px}
.price{border-radius:20px;padding:20px;margin:13px 0;text-align:right}
.free{background:#f3f7fb;border:1px solid #dce8ef}.basij{background:#eef9f2;border:1px solid #ccebd8}
.label{font-size:14px;color:#607179;margin-bottom:8px}.amount{font-size:29px;font-weight:800}.unit{font-size:14px;font-weight:500;margin-right:5px;color:#66757b}
.note{margin-top:22px;padding-top:18px;border-top:1px solid #edf0f1;font-size:12px;color:#78858a;line-height:2}
.footer{margin-top:18px;font-size:12px;color:#9aa4a8}
</style>
</head>
<body>
<main class="card">
<div class="logo">🏊</div>
<h1>استخر شهدای بسیج</h1>
<div class="sub">قیمت بلیط</div>

<section class="price free">
<div class="label">بلیط آزاد</div>
<div class="amount">۲۵۰٬۰۰۰ <span class="unit">تومان</span></div>
</section>

<section class="price basij">
<div class="label">ویژه بسیجیان</div>
<div class="amount">۱۲۰٬۰۰۰ <span class="unit">تومان</span></div>
</section>

<div class="note">برای استفاده از تعرفه ویژه بسیجیان، ارائه مدرک معتبر الزامی است.</div>
<div class="footer">استخر شهدای بسیج</div>
</main>
</body>
</html>
